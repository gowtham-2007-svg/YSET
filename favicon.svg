<svg viewBox="0 0 120 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="fav-shield-top">
      <polygon points="28,8 92,8 92,25 60,45 28,25"/>
    </clipPath>
    <clipPath id="fav-shield-left">
      <path d="M28 25 L60 45 V81 C48 78 28 65 28 42 Z"/>
    </clipPath>
    <clipPath id="fav-shield-right">
      <path d="M92 25 L60 45 V81 C72 78 92 65 92 42 Z"/>
    </clipPath>
    <path id="fav-banner-curve" d="M25 80 Q60 93 95 80"/>
  </defs>

  <!-- Background white circle for clarity at small sizes -->
  <circle cx="60" cy="50" r="52" fill="#ffffff"/>

  <!-- Top Lime Green Segment -->
  <g clip-path="url(#fav-shield-top)">
    <rect x="25" y="5" width="70" height="42" fill="#9EC73D"/>
    <line x1="32" y1="26" x2="62" y2="7" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="42" y1="28" x2="74" y2="7" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="52" y1="30" x2="86" y2="7" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="62" y1="33" x2="94" y2="12" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="72" y1="35" x2="94" y2="21" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="82" y1="37" x2="94" y2="29" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Bottom-Left Sky Cyan Segment -->
  <g clip-path="url(#fav-shield-left)">
    <rect x="25" y="24" width="37" height="60" fill="#38B7E8"/>
    <line x1="26" y1="30" x2="62" y2="48" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="26" y1="39" x2="62" y2="57" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="26" y1="48" x2="62" y2="66" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="26" y1="57" x2="62" y2="75" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="65" x2="56" y2="78" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Right Grey Segment -->
  <g clip-path="url(#fav-shield-right)">
    <rect x="58" y="24" width="37" height="60" fill="#8F9297"/>
    <line x1="67" y1="46" x2="67" y2="78" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="74" y1="42" x2="74" y2="74" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="81" y1="37" x2="81" y2="69" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="88" y1="32" x2="88" y2="61" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Dividing Borders -->
  <path d="M28 8 H92 V42 C92 65 72 78 60 81 C48 78 28 65 28 42 Z" stroke="#ffffff" stroke-width="2" fill="none"/>
  <path d="M28 25 L60 45 L92 25" stroke="#ffffff" stroke-width="2" fill="none"/>
  <line x1="60" y1="45" x2="60" y2="81" stroke="#ffffff" stroke-width="2"/>

  <!-- Banner Ribbon Tails and Folds -->
  <polygon points="12,69 26,67 26,79 12,82 18,75.5" fill="#9CA3AF" stroke="#6B7280" stroke-width="0.8"/>
  <polygon points="108,69 94,67 94,79 108,82 102,75.5" fill="#9CA3AF" stroke="#6B7280" stroke-width="0.8"/>
  <polygon points="26,67 33,75 26,79" fill="#111827"/>
  <polygon points="94,67 87,75 94,79" fill="#111827"/>

  <!-- Main Curved Banner -->
  <path d="M22 71 Q60 86 98 71 L98 82 Q60 97 22 82 Z" fill="#C4CBD5" stroke="#4B5563" stroke-width="1"/>
  <text font-family="Arial, sans-serif" font-size="5.2" font-weight="800" fill="#1E293B" letter-spacing="0.6">
    <textPath href="#fav-banner-curve" startOffset="50%" text-anchor="middle">
      RABBI ZIDNI 'ILMA
    </textPath>
  </text>
</svg>
